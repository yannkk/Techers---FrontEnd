<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><h1>Notas Legais da Reze</h1></header>
    <main>
    <div id="div">
        <h2>Adicionar uma nova tarefa</h2>
        <hr>
        Titulo:
        <input id="tituloTarefa" type="text" required placeholder="Digite o titulo da sua tarefa aqui!" style="height: 30px;">
        Conteúdo:
        <input id="conteudoTarefa" type="text" required placeholder="Digite a sua tarefa aqui!">
        <button type="submit" id="buttonTarefa"><p style="color: white;">Salvar nota</p></button>
    </div>
    <div id="divdivona">
        <div id="divReze">
            <h2>Minhas Notas</h2>
            <img id="rezeDançando" src="assets/reze-dance.gif" alt="Reze Dançando">
        </div>
       
        <hr>
        <div id="notesTarefa" >

        </div>
    </div>
</main>
    
    <script src="script.js"></script>
</body>
</html>
